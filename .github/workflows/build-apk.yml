name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate JavaScript
        run: |
          node --check app/src/main/assets/chat-engine.js
          node --check app/src/main/assets/chat-gpt.js
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          src = pathlib.Path('app/src/main/assets/index.html').read_text()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', src, re.S)
          assert scripts, 'No inline scripts found'
          for script in scripts:
              with tempfile.NamedTemporaryFile(suffix='.js', mode='w', encoding='utf-8') as f:
                  f.write(script)
                  f.flush()
                  subprocess.run(['node','--check',f.name], check=True)
          PY
      - name: Provision IMS credential from GitHub Actions secret
        id: ims
        env:
          IMS_API_TOKEN: ${{ secrets.IMS_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$IMS_API_TOKEN" ]; then
            printf '%s' "$IMS_API_TOKEN" > app/src/main/assets/ims-bootstrap.txt
            echo "bundled=true" >> "$GITHUB_OUTPUT"
          else
            : > app/src/main/assets/ims-bootstrap.txt
            echo "bundled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Atmos-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Do not publicly release APK files with a credential embedded.
      - name: Publish public APK download
        if: ${{ steps.ims.outputs.bundled != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="atmos-gpt-beta-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk#Atmos-GPT-Beta.apk \
            --title "Atmos GPT Beta build ${GITHUB_RUN_NUMBER}" \
            --notes "Experimental Android beta APK. Sign in with ChatGPT is not yet validated end-to-end." \
            --prerelease \
            --latest=false
